<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spokeys - Bike Rides</title>
    <meta name="description" content="Interactive maps of bike rides with the Spokeys cycling group." />
    <script>
      // Apply theme before first paint so dark-mode users don't see a
      // white flash. Falls back to the OS preference if nothing is stored.
      (function () {
        try {
          var stored = localStorage.getItem("spokeys-theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored || (prefersDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          // Storage blocked — default to light, harmless.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
